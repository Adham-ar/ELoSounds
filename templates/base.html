<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ELoSounds | Audio Equipment Benchmark{% endblock %}</title>


   <!-- Google Fonts: Damion, Sora & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Damion&family=Outfit:wght@500;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet">

    <!-- Chart.js CDN for Frequency Response Curves -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --text-primary: #0f172a;
            --text-muted: #64748b;
            --accent-primary: #2563eb;
            --accent-hover: #1d4ed8;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
        }

        .brand-logo {
        font-family: 'Damion', cursive;
        font-size: 1.75rem; /* Script fonts render slightly smaller, so bump up size */
        font-weight: 400;   /* Damion only comes in regular weight */
        letter-spacing: normal; /* Script/cursive fonts should not have negative letter-spacing */
        color: var(--text-primary);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        }

        .brand-logo img {
            height: 42px; /* Adjusted from 30px */
            width: auto;
            display: block;
        }

        .brand-logo .accent {
            color: var(--accent-primary);
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-link {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .nav-link:hover {
            color: var(--accent-primary);
        }

        /* Global Container */
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1.5rem;
            flex: 1;
        }

        /* Buttons & Badges */
        .btn-primary {
            background-color: var(--accent-primary);
            color: #ffffff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .badge {
            background-color: #eff6ff;
            color: var(--accent-primary);
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid #bfdbfe;
        }

        /* Footer */
        footer {
            background-color: var(--bg-card);
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <nav class="navbar">
        <a href="/" class="brand-logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="ELoSounds Logo">
            <span>ELo<span class="accent">Sounds</span></span>
        </a>

        {% block nav_search %}
        <form action="/" method="GET" style="display: flex; gap: 0.5rem; align-items: center; width: 100%; max-width: 450px;">
           <input
            type="text"
            name="q"
            value="{{ search_query if search_query else '' }}"
            placeholder="Search headphones, IEMs, or brands..."
            style="flex: 1; padding: 0.5rem 1rem; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.9rem; outline: none;"
            >
            <button type="submit" class="btn-primary" style="padding: 0.5rem 1rem;">Search</button>
        </form>
        {% endblock %}

        <div class="nav-links">
            <a href="/" class="nav-link">Catalog</a>
            <a href="/compare" class="nav-link">Compare Engine</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 ELoSounds By Adham Amr.</p>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
